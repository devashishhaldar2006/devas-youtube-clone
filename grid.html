<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Practice</title>
</head>
<body style="padding-bottom: 1000px;">
    <div style="display: grid; grid-template-columns: 100px 100px;">
        <div style="background-color: lightblue;">Div 1</div>
        <div style="background-color: lightpink;">Div 2 <p>text</p></div>
    </div>
    <div style="margin-top: 30px; display: grid; grid-template-columns: 100px 100px 200px;">
        <div style="background-color: lightblue;">Div 1</div>
        <div style="background-color: lightpink;">Div 2 <p>text</p></div>
        <div style="background-color: rgb(187, 199, 203);">Div 1</div>
        <div style="background-color: lightpink;">Div 2 <p>text</p></div>
    </div>
    <div style="margin-top: 30px; display: grid; grid-template-columns: 100px 1fr 2fr;">
        <div style="background-color: lightblue;">Div 1</div>
        <div style="background-color: lightpink;">Div 2</div>
        <div style="background-color: lightblue;">Div 3</div>
    </div>
    <div style="margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr 1fr;column-gap: 20px;row-gap: 30px;">
        <div style="height: 300px; background-color: lightblue;">Div 1</div>
        <div style="height: 300px;background-color: lightpink;">Div 2</div>
        <div style="height: 300px;background-color: lightblue;">Div 3</div>
    </div>
    <div style="margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr 1fr;column-gap: 20px;">
        <div style="height: 300px; background-color: lightblue;">Div 1</div>
        <div style="height: 300px;background-color: lightpink;">Div 2</div>
        <div style="height: 300px;background-color: lightblue;">Div 3</div>
    </div>
</body>
</html>
