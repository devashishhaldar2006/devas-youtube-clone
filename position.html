<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
</head>
<body style="height: 3000px;padding-top: 60px;padding-left: 80px;">
    <div style="background-color:black;color: white; position: fixed; top: 0px; left: 0px;right: 0px;height: 50px;
    z-index: 100;">header</div>
    <div style="
    background-color: brown;
    color: white;
    position: fixed;
    left: 0;
    bottom: 0;
    top: 50px;
    width: 72px;">
        sidebar
    <div style="
    position: absolute;
    background-color: rgb(0, 0, 0);
    color: white;
    right: 0px;
    top: 0px;">
        x
    </div>    
    </div>
    <div style="
    position: absolute;
    background-color: rgb(132, 220, 0);
    color: white;
    right: 20px;
    top: 60px;">
        absolute
    </div>
    <div style="background-color: lightblue;
    height: 200px; width: 200px;position: static;">Div 1</div>
    <div style="
    background-color: lightpink;
    height: 200px; 
    width: 200px;
    position: relative;">
    Div 2
    <div style="
        position: absolute;
        background-color: rgb(0, 0, 0);
        color: white;
        right: 10px;
        bottom: 10px;">
            5:00
    </div>
    </div>
</body>
</html>
